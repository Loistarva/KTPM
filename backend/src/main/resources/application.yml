spring:
  application:
    name: KTPM
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ktpm}
    username: ${DATABASE_USERNAME:ktpm}
    password: ${DATABASE_PASSWORD:ktpm_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
ktpm:
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  seed-enabled: false
  scheduler:
    enabled: true
    delay-ms: 5000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

