x-backend: &backend
  image: ktpm-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: &backend-env
    DATABASE_URL: jdbc:postgresql://postgres:5432/ktpm
    DATABASE_USERNAME: ${DATABASE_USERNAME:-ktpm}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ktpm_dev}
    JWT_SECRET: ${JWT_SECRET:-ktpm-local-only-secret-change-before-production-0123456789}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
    API_MAX_CONCURRENT: ${API_MAX_CONCURRENT:-48}
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 30s
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: ktpm
      POSTGRES_USER: ${DATABASE_USERNAME:-ktpm}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ktpm_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ktpm_simple_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ktpm"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    <<: *backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: dev,api
      KTPM_SEED_ENABLED: ${SEED_ENABLED:-true}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
  backend-replica:
    <<: *backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: api
  worker:
    <<: *backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: worker
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-8}
      SCHEDULER_WORKERS: ${SCHEDULER_WORKERS:-4}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-64}
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_UPSTREAM: backend:8080
      BACKEND_SECONDARY_UPSTREAM: backend-replica:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  ktpm_simple_postgres_data:

